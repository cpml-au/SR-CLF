# Conda environment for SR-CLF.  It lists the `flex` conda environment the reference jobs ran in
# (`conda list -n flex`, `pip list`).  The versions are pinned to exactly what was measured.  Do not
# change the numba / llvmlite / jax / jaxlib versions if you want the stored numbers digit for digit.
#
# WHAT EACH GROUP IS FOR
#   the search                numpy, scipy, numba, llvmlite, sympy, pyyaml, deap, cma, ray, and
#                             jax + jaxlib (src/Functions.py and flex import jax)
#   the audit                 mpmath (src/CPU/audit.py: 60-digit re-evaluation of the worst point)
#   not used by this repository   pytest, jaxopt, jax-cuda12-*, the nvidia-*-cu12 wheels.  They were
#                             in the measured environment (GPU packages), so they are listed.
#
# FLEX ITSELF is not listed under pip: below because it is not the upstream PyPI package.  Build
# it from source (upstream commit 4f5746e26b8aa2a0871bee1e1c05ccd1c5c68c04) plus the patch in
# docs/flex_patch/ -- see docs/flex_patch/README.md for the exact commands.  The version reported
# by `pip show flex` in the measured environment is 0.2.2 (editable install).
name: sr-clf
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.4.6
  - scipy=1.17.1
  - numba=0.66.0
  - llvmlite=0.48.0        # numba's own dependency; pinned explicitly since numba/llvmlite pairs
                            # are version-sensitive
  - sympy=1.14.0
  - pyyaml=6.0.3
  - mpmath=1.3.0            # the audit only (src/CPU/audit.py); not needed to run a search
  - pytest=9.1.1             # not used by this repository
  - jax=0.5.0               # imported by src/Functions.py and by flex
  - jaxlib=0.5.0            # (the cpu_py312 build was measured)
  - pip
  - pip:
      - deap==1.4.1
      - cma==4.5.0
      - ray==2.55.1
      # --- not used by this repository, from here down (GPU packages of the measured environment) ---
      - jax-cuda12-plugin==0.5.0
      - jax-cuda12-pjrt==0.5.0
      - jaxopt==0.8.4
      - nvidia-cublas-cu12==12.9.2.10
      - nvidia-cuda-cupti-cu12==12.9.79
      - nvidia-cuda-nvcc-cu12==12.9.86
      - nvidia-cuda-nvrtc-cu12==12.9.86
      - nvidia-cuda-runtime-cu12==12.9.79
      - nvidia-cudnn-cu12==9.24.0.43
      - nvidia-cufft-cu12==11.4.1.4
      - nvidia-cusolver-cu12==11.7.5.82
      - nvidia-cusparse-cu12==12.5.10.65
      - nvidia-nccl-cu12==2.30.7
      - nvidia-nvjitlink-cu12==12.9.86
      # --- Flex: install separately, not from this file (see docs/flex_patch/README.md) ---
      #   git clone https://github.com/cpml-au/Flex
      #   cd Flex && git checkout 4f5746e26b8aa2a0871bee1e1c05ccd1c5c68c04
      #   git apply <this repo>/docs/flex_patch/regressor_symclf.patch
      #   pip install -e .
